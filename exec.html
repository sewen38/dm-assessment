var md=`# 多米尼克投资入籍(CBI)执行策划案\n\n> 生成日期：2026-06-08\n> 适用对象：拟通过多米尼克投资入籍计划取得第二护照的中国家庭/企业主\n> 文档版本：客户交付版 V1.0\n> 重要声明：本策划案为商业规划与执行框架，不构成法律、税务、投资或移民建议；落地前须由多米尼克CBI Unit授权代理及持牌律师进行最终确认。多米尼克护照仅限境外使用，不得用于中国出入境或在中国境内作为身份证明。\n\n---\n\n## 摘要结论\n\n本方案建议客户以多米尼克经济多元化基金(EDF)捐款入籍为主路径，这是加勒比地区历史最悠久（1993年启动）的CBI项目之一。多米尼克护照的核心价值在于：**全球140+国免签（含申根区、英国、新加坡、香港）**、**0%个人所得税/资本利得税/遗产税**、**无居住要求**、**无语言/学历要求**、**允许双重国籍**。\n\n⚠️ 重要变化（2024年起）：加勒比五国集体涨价（从$100K级→$200K级），强制面试要求，美国签证优待取消、部分免签国家受限、安全审查大幅加强。\n\n本方案定位：**功能性护照+资产保护工具**。多米尼克不适合作为实际居住国（岛国、基础设施有限），也不适合作为美国E-2跳板（多米尼克非美国E-2条约国）。其核心用途为：国际出行便利、境外银行开户、税务居民规划、资产配置多元化。\n\n本方案执行重点：第一，资金来源必须可解释，应对CBI Unit严格的反洗钱审查；第二，2024年起强制面试不可跳过（需赴迪拜/香港等海外指定办公室）；第三，护照仅限境外使用，严禁用于中国出入境。\n\n## 一、客户家庭基本信息（待补充版）\n\n### 1.1 已知/默认信息\n\n| 项目 | 当前信息 | 状态 |\n|---|---|---|\n| 客户身份 | 中国籍家庭/企业主/高净值客户 | ⚠️ 待确认 |\n| 核心目标 | 取得第二本护照、全球免签出行、境外银行开户、资产保护、税务规划 | ⚠️ 待确认 |\n| 预算范围 | EDF捐款单人$200,000起；家庭$250,000起 | ✅ 已知政策门槛 |\n| 家庭成员 | 主申请人、配偶、30岁以下在读子女、65岁以上父母可随行 | ⚠️ 待确认家庭结构 |\n| 是否计划居住 | 默认无长期居住计划（多米尼克无居住要求） | ✅ 匹配 |\n| 是否计划赴美 | ⚠️ 多米尼克非美国E-2条约国，不适合E-2跳板 | ⚠️ 如目标含赴美需另选方案 |\n| 资金来源 | 捐款/购房款需合规出境，CBI Unit严格审查 | ❌ 待确认 |\n| 税务身份 | 中国税务居民为默认假设 | ⚠️ 待确认 |\n| 现有护照情况 | 中国护照有效期、是否有其他护照/居留 | ❌ 待确认 |\n\n### 1.2 待解决问题分级\n\n| 编号 | 问题 | 严重度 | 说明 |\n|---|---|---|---|\n| Q1 | 多米尼克身份目标是否正确 | P1 | 功能性护照+资产保护，非居住/教育/福利国 |\n| Q2 | 资金出境路径是否合法 | P0 | $200K+资金须合规出境，严禁地下钱庄 |\n| Q3 | 中国国籍冲突风险 | P0 | 中国不承认双重国籍，多米尼克护照严禁用于中国出入境 |\n| Q4 | 强制面试准备 | P1 | 2024年起加勒比五国CBI统一要求强制面试 |\n| Q5 | ⚠️ 美国签证优待取消 | P1 | 2024年与美国签证互惠安排受限，E-2不可用 |\n| Q6 | 免签政策变化风险 | P2 | 2024年起部分免签受限、安全审查从严 |\n| Q7 | 随行成员年龄限制 | P1 | 子女≤30岁且全日制在读；父母≥65岁 |\n| Q8 | CBI护照长期有效性 | P2 | 首次10年护照；续签不受限制 |\n| Q9 | 税务居民风险 | P2 | 0%个税但需管理中国税务居民身份 |\n\n### 1.3 根本判断\n\n**表面问题**：客户想办一本加勒比护照。\n\n**真实问题**：客户需要一个成本适中、审批较快、免签范围广、无居住要求、税务友好的功能性身份工具，用于国际出行、境外银行开户、资产分散和税务居民规划，但必须在中国国籍合规边界内操作。\n\n---\n\n## 二、核心策略\n\n### 2.1 三分离定位\n\n| 维度 | 多米尼克方案中的定位 | 判断 |\n|---|---|---|\n| 事业国 | 中国 | 多米尼克非商业经营目的地 |\n| 居住国 | 中国（或客户其他主要居住地） | 多米尼克无居住要求，不作为生活地 |\n| 福利国 | 非福利工具 | 多米尼克基础医疗、有限教育资源 |\n| 管钱地 | 香港/新加坡/迪拜/瑞士等 | 多米尼克护照用于开户便利，非资产管理中心 |\n| 功能性身份 | 140+国免签+税务友好+银行开户 | 核心价值所在 |\n\n### 2.2 两条投资路径对比\n\n| 维度 | 路径A：EDF捐款 | 路径B：政府批准房地产 |\n|---|---|---|\n| 投资性质 | 不可回收捐款 | 房产投资（可售） |\n| 单人门槛 | $200,000 | $200,000 |\n| 家庭门槛 | $250,000起（按成员递增） | $200,000（投资额不变，成员另缴附加费） |\n| 附加费用 | 尽调费+面试费+政府费 | 尽调费+面试费+政府费+房产交易税费 |\n| 退出机制 | 无（捐款不可回） | 3年后可卖；5年后可卖予另一CBI申请人 |\n| 流动性 | — | 流动性差、小岛国房产交易不活跃 |\n| 优点 | 流程简单、确定性高 | 理论上有资产承载 |\n| 缺点 | 捐款不可回收 | 流动性风险、管理费、退出不确定性 |\n\n### 2.3 推荐核心路线\n\n**推荐方案A：EDF捐款入籍 — 首选。**\n\n理由：流程最简单、确定性最高、成本最清晰、无后续房产管理负担。建议对于以"功能性护照+境外开户"为核心目标的客户，选择EDF捐款路径。\n\n**推荐方案B：政府批准房产投资 — 仅适合希望有实物资产承载的客户。**\n\n---\n\n
### 2.2 两条投资路径深度对比分析

#### 路径A：EDF捐款入籍——全面解析

| 维度 | 详细内容 |
|---|---|
| **投资性质** | 向多米尼克政府经济多元化基金(Economic Diversification Fund)不可退还捐款 |
| **法律依据** | 《多米尼克公民法》第8条和第9条；CBI Regulations |
| **单人门槛** | USD 200,000（加勒比五国中最低） |
| **配偶随行** | USD 250,000（主申+配偶） |
| **四人家庭** | USD 250,000（主申+配偶+2名≤18岁子女） |
| **额外子女** | USD 25,000/人（18-30岁全日制在读且经济依赖） |
| **退款保证** | ✅ 如CBI Unit最终拒绝申请，捐款全额退还 |
| **付款节点** | 原则批准函(Approval in Principle)签发后支付 |
| **审批周期** | 约4-6个月（从提交申请到护照签发） |
| **尽调费** | 主申USD 7,500；配偶USD 7,500；≥16岁子女USD 4,000 |
| **强制面试** | ⚠️ 2024年起不可跳过（迪拜/香港等海外办公室） |
| **护照有效期** | 10年（到期后正常续签） |

**EDF路径优势矩阵：**

| 优势 | 说明 |
|---|---|
| 最低成本 | 五人中捐款门槛最低(USD 200K) |
| 确定性最高 | 无房产流动性、估值、退出不确定性 |
| 流程最简单 | 无需选房、法律审查、产权调查、房产管理 |
| 无后续负担 | 无物业费/管理费/房产税/年度维护 |
| 退出最省心 | 无需担心卖房、找买家、价格谈判 |

**EDF路径风险：**

| 风险 | 应对 |
|---|---|
| 捐款不可回收 | 定位为"身份消费"，非投资 |

## 三、合规清理详细方案\n\n### 3.1 资金来源合规\n\n多米尼克CBI Unit对资金来源的审查非常严格（尤其2024年后强化）：\n\n| 环节 | 合规要求 | 风险点 | 执行动作 |\n|---|---|---|---|\n| 资金来源 | 能清晰说明合法来源 | 现金收入无凭证、灰色收入 | 准备收入证明、纳税记录、企业分红/股权转让文件 |\n| 资金出境 | 从合规渠道支付至CBI指定账户 | 地下钱庄、虚假贸易 | ODI/境外存量/合规换汇 |\n| 银行流水 | 保留完整转账凭证 | 第三方代付、现金支付 | 付款全程银行可追溯 |\n| 尽调审查 | CBI Unit委托国际尽调机构审核 | 犯罪记录、制裁名单、媒体负面报道 | 提前自查，如实披露 |\n| 面试 | 2024年起强制面试 | 回答不一致、资金来源说不清 | 提前准备面试Q&A |\n| 持续合规 | 护照续签时可能再次审查 | 后续出现合规问题 | 保持良好记录 |\n\n### 3.2 2024年政策重大变化\n\n| 变化 | 详情 | 对客户影响 |\n|---|---|---|\n| **集体涨价** | 加勒比五国联合涨价$100K→$200K | 成本翻倍 |\n| **强制面试** | 所有CBI申请人必须在指定海外办公室完成面试 | 不能跳过 |\n| **美国签证优待取消** | 与美国在签证互惠方面的安排受限 | 多米尼克护照不能用于E-2 |\n| **免签紧缩** | 英国等对加勒比CBI护照持有人加强审查 | 出行前需核实最新清单 |\n| **安全审查升级** | 国际尽调机构标准提高 | 负面记录风险提高 |\n\n### 3.3 中国国籍边界\n\n**红线：多米尼克护照仅限境外金融、税务、签证、出行用途，严禁用于中国出入境。**\n\n---\n\n## 四、境外资金归集与投资架构\n\n### 4.1 推荐资金路径\n\n| 路径 | 适用客户 | 优点 | 缺点 | 适合金额 |\n|---|---|---|---|---|\n| 境外已有资产支付 | 已有香港/新加坡/美元资产 | 付款效率高 | 需解释历史来源 | $200K+ |\n| ODI商业投资 | 有企业的客户 | 合规性强 | 周期2-4月 | $200K+ |\n| 境外分红/股东借款 | 已有境外架构 | 可解释用途 | 需税务配合 | $200K+ |\n| 家庭合规购汇 | 年度额度内 | 最简单 | 每年仅$5万/人 | $5万以下 |\n| 地下钱庄 | — | — | P0红区 | — |\n\n### 4.2 CBI资金预算框架\n\n| 项目 | 预算口径（USD） | 说明 |\n|---|---:|---|\n| EDF捐款（单人） | $200,000 | 主申请人 |\n| EDF捐款（家庭四人） | $250,000 | 主申+配偶+2子女 |\n| 主申尽调费 | $7,500 | 不可退 |\n| 配偶尽调费 | $7,500 | 不可退 |\n| 16岁以上子女尽调费 | $4,000/人 | 不可退 |\n| 强制面试费 | $1,000/人×家庭 | 往返差旅另计 |\n| 政府护照费 | $1,200起/人 | 按人数 |\n| 政府行政处理费 | $1,000/人 | 按人数 |\n| 律师/授权代理服务费 | $35,000-50,000 | 行业参考 |\n| 国内公证/翻译/认证 | $500-1,500 | 按材料量 |\n| 海外面试差旅 | 视地点$3,000-5,000 | 迪拜/香港 |\n\n---\n\n## 五、投资使用建议\n\n### 5.1 EDF捐款路径详解\n\n| 维度 | 内容 |\n|---|---|\n| 捐款性质 | 向多米尼克政府经济多元化基金(EDF)捐款 |\n| 可否回收 | 不可回收（纯捐款） |\n| 最低金额（单人） | USD 200,000 |\n| 最低金额（主申+配偶） | USD 250,000 |\n| 付款节点 | 原则批准后 |\n| 退款保证 | 如申请被拒，捐款全额退还 |\n\n### 5.2 政府批准房地产路径\n\n| 维度 | 内容 |\n|---|---|\n| 最低投资 | USD 200,000 |\n| 持有期 | 3年（锁定期） |\n| 5年转售 | 5年后可售予另一CBI申请人 |\n| 退出风险 | 房产流动性差、估值不确定 |\n\n### 5.3 不建议做法\n\n- 不建议只为CBI购买不了解的多米尼克房产\n- 不建议相信"房价必涨"或"一定有人接手"的承诺\n- 不建议将CBI房产作为主要资产配置\n\n---\n\n## 六、财富架构搭建方案\n\n### 6.1 推荐架构\n\n\`\`\`text\n中国境内事业主体/家庭资产\n        ↓ 合规资金路径\n多米尼克护照（境外身份工具）\n        ↓ 用于\n┌──────────────────────────────┐\n│ 香港/新加坡/迪拜/瑞士银行账户 │\n└──────────────────────────────┘\n        ↓ 配置\n全球资产组合（股票/债券/基金/保险）\n        ↓ 可选\n海外信托（传承规划）\n\`\`\`\n\n### 6.2 多米尼克税务优势\n\n| 税种 | 多米尼克 | 说明 |\n|---|---|---|\n| 个人所得税 | 0% | 无个人所得税 |\n| 资本利得税 | 0% | 出售资产收益不征税 |\n| 遗产税 | 0% | 财富传承零税负 |\n| 财富税 | 0% | 不按资产净值征税 |\n| 公司税 | 25% | 仅对在当地经营的企业 |\n| CRS | 参与 | 已签署CRS多边协议 |\n\n### 6.3 不建议架构\n\n- 不建议将全部境外资产以多米尼克名义持有\n- 不建议在多米尼克当地设立公司开展非本地业务\n- 不建议仅凭多米尼克护照进行复杂税务规划\n\n---\n\n

### 6.2 CBI护照的境外金融用途

| 用途 | 操作方式 | 注意事项 |
|---|---|---|
| 香港银行开户 | 多米尼克护照+地址证明+资金来源 | 选择对CBI接受度高的银行 |
| 新加坡银行开户 | 多米尼克护照+税务居民声明 | 私银门槛通常≥USD 1M |
| 迪拜银行开户 | 多米尼克护照+阿联酋签证(如需要) | 接受度相对较高 |
| 瑞士银行开户 | 多米尼克护照+大额资金 | 需详细资金来源说明 |
| 境外保险/投连险 | 多米尼克护照+健康告知 | 部分保险公司可能不接受CBI |
| 境外券商/投资账户 | 多米尼克护照+税务居住证明 | 如Interactive Brokers, Saxo等 |

### 6.3 多米尼克税务优势详解

| 税种 | 多米尼克 | 香港 | 新加坡 | 阿联酋 |
|---|---|---|---|---|
| 个人所得税 | 0% | 2%-17% | 0%-24% | 0% |
| 资本利得税 | 0% | 无 | 无 | 0% |
| 遗产税 | 0% | 无 | 无 | 0% |
| 公司税 | 25% | 8.25%-16.5% | 17% | 0%-9% |
| CRS参与 | ✅ | ✅ | ✅ | ✅ |

⚠️ 重要提醒：0%个税≠可以在中国不纳税。中国税务居民的全球收入仍须在中国申报纳税。多米尼克护照的税务优势本质是"在境外开立账户时可用作低税率/零税率管辖区的税务居民声明，但在中国境内的纳税义务不变。"


## 七、税务分析\n\n### 7.1 多米尼克税务居民\n\n| 情形 | 税务判断 |\n|---|---|\n| 仅持有多米尼克护照，不居住 | 不自动成为多米尼克税务居民 |\n| 在多米尼克居住≥183天 | 可能触发税务居民（但0%个税） |\n| 中国仍为主要居住地 | 中国税务居民身份通常持续 |\n\n### 7.2 税务风险边界\n\n- 多米尼克不征税≠客户自动免税：中国税务居民全球征税义务不变\n- 多米尼克护照≠避税工具：CRS信息交换机制下，金融机构账户信息会交换至中国\n- 如客户希望切换税务居民：需要实际居住+经济联系+183天规则\n\n---\n\n## 八、资金跨境合规方案\n\n### 8.1 推荐执行路径\n\n| 阶段 | 动作 | 周期 |\n|---|---|---|\n| 第1阶段 | 客户资产和资金来源体检 | 1-2周 |\n| 第2阶段 | 确认资金出境方式 | 2-6周 |\n| 第3阶段 | 确认境外付款账户 | 1-3周 |\n| 第4阶段 | 准备资金来源说明文件包 | 1-2周 |\n| 第5阶段 | 等待原则批准后支付捐款 | CBI审批后 |\n\n### 8.2 严禁路径\n\n- 地下钱庄/加密货币洗钱\n- 现金搬运\n- 虚假贸易\n- 第三方代付且无合理解释\n\n---\n\n### 8.2.1 个人境外投资合规——37号文登记\n\n37号文全称《国家外汇管理局关于境内居民通过特殊目的公司境外投融资及返程投资外汇管理有关问题的通知》（汇发〔2014〕37号），是境内居民个人境外投资最重要的合规路径之一。\n\n**适用对象：** 境内居民个人以境外SPV进行境外投融资及返程投资。\n\n**核心要求：** 需在SPV设立后、出资前办理外汇登记（通过银行）。\n\n**未登记后果：** 无法合规注入境外资产；返程投资外汇无法入境；可能被认定逃汇。\n\n**与ODI互补：** ODI覆盖企业对外投资，37号文覆盖个人境外持股。\n\n**操作要点：** 先登记后出资，不可补办；周期1-3个月。\n\n\n\n## 九、身份路径规划\n\n### 9.1 多米尼克CBI主路径\n\n| 维度 | 内容 |\n|---|---|\n| 项目名称 | Dominica Citizenship by Investment (CBI) Programme |\n| 启动年份 | 1993年（加勒比最早） |\n| 法律依据 | 《多米尼克公民法》第8条和第9条及CBI Regulations |\n| 主管机构 | Dominica Citizenship by Investment Unit (CBI Unit) |\n| 投资方式A | EDF捐款：单人$200,000起 |\n| 投资方式B | 政府批准房地产：≥$200,000，持有3年 |\n| 审批周期 | 4-6个月 |\n| 居住要求 | 无 |\n| 语言要求 | 无 |\n| 随行成员 | 配偶+30岁以下全日制在读且经济依赖的子女+65岁以上经济依赖的父母 |\n| 双重国籍 | ✅ 多米尼克允许 |\n| 强制面试 | ⚠️ 2024年起 |\n| 护照有效期 | 10年，可续 |\n\n### 9.2 EDF捐款家庭价格表\n\n| 家庭组成 | EDF捐款 | 尽调费 | 面试费 |\n|---|---|---|---|\n| 单人 | $200,000 | $7,500 | $1,000 |\n| 主申+配偶 | $250,000 | $15,000 | $2,000 |\n| 主申+配偶+子女(≤18岁)×2 | $250,000 | $15,000 | $4,000 |\n| 主申+配偶+子女(16-30岁)×2 | $275,000 | $23,000 | $4,000 |\n\n### 9.3 强制面试详解\n\n| 维度 | 内容 |\n|---|---|\n| 要求生效 | 2024年起加勒比五国CBI统一 |\n| 面试地点 | 迪拜、香港、伦敦等海外指定办公室 |\n| 面试内容 | 身份核实、申请动机、资金来源、背景信息 |\n| 语言 | 英语（可带翻译） |\n| 不可跳过性 | ⚠️ 不能豁免或跳过 |\n\n### 9.4 CBI审批流程\n\n| 步骤 | 动作 | 周期 |\n|---|---|---|\n| 1 | 客户确认投资路径+联系授权代理 | 1-2周 |\n| 2 | 准备申请材料 | 2-4周 |\n| 3 | 提交尽调申请 | 1周 |\n| 4 | 国际尽调机构背景审查 | 4-8周 |\n| 5 | 预约并完成强制面试 | 1-2周 |\n| 6 | 原则批准+支付捐款 | 付款期 |\n| 7 | 政府最终审批 | 2-4周 |\n| 8 | 签发公民证书+护照 | 2-4周 |\n| **总时间** | **约4-6个月** | |\n\n### 9.5 护照使用指南\n\n| 使用场景 | 操作方式 |\n|---|---|\n| 国际旅行 | 使用多米尼克护照+当地签证/免签 |\n| 中国出入境 | 严格使用中国护照 |\n| 境外银行开户 | 多米尼克护照+地址+资金来源说明 |\n| 境外购买保险/金融产品 | 多米尼克护照+税务居民声明 |\n| 华侨生联考 | ⚠️ 部分高校可能接受，需逐校确认 |\n\n---\n\n## 十、教育规划\n\n### 10.1 多米尼克身份在教育上的使用\n\n| 用途 | 价值 | 限制 |\n|---|---|---|\n| 国际学校（中国境内） | 以"外籍身份"报考 | 需核实目标学校是否接受CBI护照 |\n| 国际学校（海外） | 外籍身份申请签证更灵活 | 具体招生规则逐校核实 |\n| 华侨生联考 | ⚠️ 理论上可行但需逐校确认 | 部分高校可能不接受CBI护照 |\n| 子女随行入籍 | 18岁（部分情况30岁）以下子女可随行 | 子女超龄后不能随行 |\n\n### 10.2 子女年龄关键节点\n\n| 年龄 | CBI随行资格 | 建议 |\n|---|---|---|\n| ≤18岁 | ✅ 可随行 | 无额外条件 |\n| 19-25岁 | ✅ 需全日制在读+经济依赖 | 需在学证明 |\n| 26-30岁 | ⚠️ 需全日制在读+经济依赖+未婚 | 条件较严 |\n| >30岁 | ❌ 不可随行 | 须独立申请 |\n\n---\n\n## 十一、福利居住国规划\n\n### 11.1 多米尼克生活现实\n\n| 维度 | 实际情况 | 判断 |\n|---|---|---|\n| 面积 | 751平方公里 | 小岛国 |\n| 人口 | 约7.3万 | 社区小 |\n| 语言 | 英语（官方） | 沟通无障碍 |\n| 医疗 | 基础医疗设施 | 大病需赴邻国 |\n| 教育 | 有限国际学校 | 不作为主要教育地 |\n| 气候 | 热带海洋性，飓风季节 | 需关注自然灾害风险 |\n\n### 11.2 推荐定位\n\n**多米尼克≠居住国**。定位：功能性护照+境外开户工具+税务友好身份+申根/英国免签出行。\n\n---\n\n## 十二、预算明细汇总\n\n

## 十四、重要风险声明\n\n### 14.1 国籍风险\n\n**中国不承认双重国籍。客户取得多米尼克国籍后，如在中国出入境或境内身份使用中发生交叉使用，可能触发国籍冲突和行政风险。多米尼克护照只能作为境外功能性身份工具使用。**\n\n### 14.2 EDF捐款不可回收\n\n**EDF捐款为向多米尼克政府的一笔不可退还捐款。客户支付的捐款不构成投资，不存在退出机制或回报。**\n\n### 14.3 政策变化风险\n\n**多米尼克CBI政策历史上多次调整。2024年加勒比五国集体涨价（$100K→$200K），未来可能进一步提高门槛、变更免签安排或调整家庭成员定义。**\n\n### 14.4 免签政策风险\n\n**多米尼克护照的免签国家清单可能因国际关系变化而调整。英国、申根区等已对加勒比CBI护照加强审查。出行前须逐国核实最新免签政策。**\n\n### 14.5 ⚠️ 美国E-2不可用\n\n**多米尼克不是美国E-2条约国。取得多米尼克护照后不能申请美国E-2签证。如需E-2赴美路径，应选择格林纳达或土耳其。**\n\n### 14.6 税务风险\n\n**取得多米尼克护照不等于改变中国税务居民身份。中国税务居民全球收入仍须在中国申报纳税。CRS框架下，境外银行账户信息可能自动交换至中国。**\n\n### 14.7 强制面试风险\n\n**2024年起加勒比CBI强制面试不可跳过。面试中需清晰回答资金来源、申请动机等问题，需额外安排时间和预算。**\n\n### 14.8 身份长期风险\n\n**多米尼克护照有效期10年，续签通常无障碍。但长期来看，国际社会对CBI护照的接受度可能在加强审查的趋势下进一步收紧。**\n\n---\n\n## 附件：引用法律法规与项目资料来源\n\n### A. 本次方案引用到的法律依据清单\n\n| 法案/规则 | 条款 | 本次用途 | 最新状态 |\n|---|---|---|---|\n| 《多米尼克公民法》（Citizenship Act, Chap. 1:10） | 第8条：通过注册获得公民身份；第9条：特殊情况 | CBI的上位法依据 | 现行有效 |\n| 《多米尼克投资入籍条例》（Citizenship by Investment Regulations） | 全部 | CBI具体规则：投资门槛、尽调、审批 | 2024年修订 |\n| CBI Unit操作手册与指南 | 全篇 | 申请流程、材料清单、面试要求 | 2024年 |\n| 加勒比五国CBI联合声明（2024） | 全篇 | 集体涨价$200K+、强制面试、安全审查 | 2024年 |\n| 《中华人民共和国国籍法》 | 第3条：不承认双重国籍 | 中国国籍安全边界 | 现行有效 |\n| 《中华人民共和国国籍法》 | 第9条：自动丧失条款 | 风险提示核心 | 现行有效 |\n| 《中华人民共和国出境入境管理法》 | 出入境证件一致性 | 多米尼克护照不得用于中国出入境 | 现行有效 |\n\n### B. 多个法案之间的相互影响\n\n| 组合 | 相互影响 | 需注意 |\n|---|---|---|\n| 多米尼克公民法+CBI条例 | 公民法给入口，条例给操作规则 | 两者须同时满足 |\n| CBI条例+五国联合声明 | 五国统一涨价+面试+审查标准 | 各国独立但协调一致 |\n| 多米尼克双重国籍+中国不承认 | 国籍制度冲突 | 以"境外功能性身份"定位 |\n| 多米尼克身份+中国税务居民 | 0%个税≠中国免税 | CRS信息交换不受影响 |\n| CBI护照+英国/申根免签 | 免签政策受国际关系影响 | 出行前核实最新状态 |\n\n### C. 法律适用注意事项\n\n1. **CBI Unit审批为最终决定**：即使满足所有法定条件，CBI Unit仍有裁量权拒绝申请。\n2. **尽调不通过=不可重新申请**：如果国际尽调机构发现严重问题，可能永久禁止申请。\n3. **强制面试不可跳过**：2024年起这是硬性要求。\n4. **材料一致性至关重要**：申请表格、宣誓书、面试回答中的所有信息必须一致。\n5. **捐款不可退（申请被拒除外）**：原则批准后支付的EDF捐款正常情况下不可退还。\n6. **中国国籍风险不能淡化**：所有客户沟通必须明确"多米尼克护照仅限境外使用"。\n7. **护照续签**：10年有效期到期后可续签，须保持良好合规记录。\n\n### D. 交付前客户需补充与确认资料\n\n1. 客户完整家庭信息（配偶+所有子女确切年龄+在读/工作状态+父母年龄）\n2. 所有申请人护照、出生证明、身份证、户口本\n3. 主申+配偶无犯罪记录证明（近6个月内）\n4. 资金来源详细说明及证明材料\n5. 体检报告（HIV+TB检测，指定格式）\n6. 专业推荐信2封（非亲属，认识≥2年）\n7. 银行推荐信+银行对账单（6个月）\n8. 授权代理出具的最新CBI报价和服务合同\n9. 面试行程规划（迪拜/香港）\n\n## 附录：常见问题FAQ与实施检查清单\n\n### E. 常见问题FAQ\n\n#### Q1: 多米尼克护照能去哪些国家？\n\n免签/落地签140+国家和地区：申根区26国(90天/180天含法德意西葡等)、英国(6个月)、爱尔兰(3个月)、新加坡(30天)、香港(90天)、韩国(90天)、巴西(90天)、瑞士(90天)等。⚠️ 美国需独立申请B1/B2签证（多米尼克非E-2条约国），加拿大需签证，澳大利亚/新西兰需eTA。出行前须以多米尼克CBI Unit/外交部最新免签清单为准。\n\n#### Q2: EDF捐款和房地产投资选哪个？\n\n| 维度 | EDF捐款 | 房地产投资 |\n|---|---|---|\n| 性质 | 不可回收捐款 | 房产（可售） |\n| 单人成本 | $200,000 | $200,000+交易税费 |\n| 退出机制 | 无 | 3年后出售 |\n| 流动性 | — | 极差（小岛国市场） |\n| 确定性 | ★★★★★ | ★★ |\n| 持有负担 | 无 | 物业费/管理费/税费 |\n| 推荐 | ✅ 首选 | 仅实体资产偏好 |\n\n**结论**：除非客户对"持有实体房产"有强烈偏好，否则推荐EDF捐款路径（流程最清晰、无后续负担）。\n\n#### Q3: 强制面试难吗？会问什么？\n\n2024年起加勒比五国CBI统一要求强制面试，不可跳过。面试地点为迪拜/香港等海外指定办公室。内容含：身份核实、资金来源说明、申请动机、个人背景。语言为英语（可带翻译）。建议：提前模拟Q&A、确保回答与申请表完全一致、准备好资金来源故事线。\n\n#### Q4: 为什么不能用多米尼克护照申请美国E-2？\n\n多米尼克不是美国E-2条约国。如需E-2赴美路径，应选择：(1)格林纳达（$235K起，145+免签，E-2条约国）(2)土耳其（$400K起，E-2条约国+可退出+居留/入籍选项多）。2024年起，多米尼克等加勒比CBI护照的美国签证优待也被进一步限制。\n\n#### Q5: 多米尼克vs格林纳达vs圣基茨怎么选？\n\n| | 多米尼克 | 格林纳达 | 圣基茨 |\n|---|---|---|---|\n| EDF单人 | $200K | $235K | $250K |\n| 免签 | 140+ | 145+ | 155+ |\n| E-2赴美 | 否 | 是 | 否 |\n| 申根免签 | 是 | 是 | 是 |\n| 审批速度 | 4-6月 | 4-6月 | 4-6月 |\n| 历史 | 1993 | 2013 | 1984 |\n\n**多米尼克优势**：最低捐款门槛（五国中最低）、最早CBI之一、流程成熟。**劣势**：非E-2条约国、免签数少于圣基茨。\n\n#### Q6: 多米尼克护照能在香港/新加坡开户吗？\n\n✅ 通常可以。需提供：多米尼克护照、多米尼克地址（可用代理地址）、资金来源说明、银行推荐信。部分银行可能要求额外尽调。建议选择对CBI护照接受度较高的银行（如香港部分私银、新加坡部分外资行、迪拜银行等）。\n\n#### Q7: 护照10年到期后怎么办？\n\n到期后通过授权代理或在CBI Unit/海外使领馆续签。续签通常无特别障碍，费用约为政府护照续签费+代理服务费。前提是申请人保持良好合规记录。\n\n#### Q8: 取得多米尼克护照后中国国籍会受影响吗？\n\n在**不主动使用**多米尼克护照于中国出入境或作为中国境内身份证明的前提下，中国国籍实务中不受影响。但法律上中国不承认双重国籍——一旦有关部门获知入籍外国的事实，理论上可触发《国籍法》第9条自动丧失条款。所有客户必须充分理解这一风险。\n\n### F. 多米尼克CBI实施检查清单\n\n| 阶段 | 检查项 | 完成标志 |\n|---|---|---|\n| 路径选择 | 确认EDF捐款vs房地产投资路径 | 方案确认书 |\n| 代理确认 | 联系多米尼克CBI Unit授权代理并签约 | 代理协议 |\n| 材料准备 | 护照(≥12月有效期)彩色扫描 | 扫描件 |\n| 材料准备 | 出生证明公证+翻译 | 公证书 |\n| 材料准备 | 结婚证公证+翻译(配偶) | 公证书 |\n| 材料准备 | 无犯罪记录证明(<6个月) | 公安证明+翻译 |\n| 材料准备 | 体检报告(HIV+TB，指定格式) | 体检报告 |\n| 材料准备 | 资金来源证明文件 | 来源说明文件包 |\n| 材料准备 | 个人简历(CV)+2封推荐信 | CV+推荐信 |\n| 材料准备 | 银行推荐信+6个月对账单 | 银行文件 |\n| 申请提交 | 代理提交完整申请+尽调费 | CBI Unit受理回执 |\n| 尽调 | 国际尽调机构背景审查(4-8周) | 尽调通过通知 |\n| 面试 | 预约+完成强制面试(迪拜/香港) | 面试完成确认 |\n| 原则批准 | 收到CBI Unit原则批准函 | 批准函 |\n| 付款 | 支付EDF捐款+政府费至指定账户 | 付款凭证 |\n| 最终审批 | CBI Unit最终审批(2-4周) | 审批通过 |\n| 护照制作 | 护照制作+公民证书签发 | 护照+证书 |\n| 领取 | 护照寄送/领取 | 多米尼克护照 |\n| 持续 | 10年有效期→到期前续签 | 续签提醒 |\n\n### G. 免签主要国家/地区一览\n\n| 地区 | 免签天数 | 备注 |\n|---|---|---|\n| 申根区26国 | 90天/180天 | 法/德/意/西/葡/荷/瑞等 |\n| 英国 | 6个月 | |\n| 爱尔兰 | 3个月 | |\n| 新加坡 | 30天 | |\n| 香港 | 90天 | |\n| 韩国 | 90天 | |\n| 巴西 | 90天 | |\n| 瑞士 | 90天 | |\n| 巴拿马 | 180天 | |\n| ⚠️ 美国 | 需签证 | 非免签，E-2不可用 |\n| ⚠️ 加拿大 | 需签证 | |\n| ⚠️ 澳大利亚 | 需eTA | |\n\n### H. 加勒比五国CBI价格变化历史\n\n| 年份 | 变化 |\n|---|---|\n| 1993 | 多米尼克启动CBI，最初门槛约$50,000-100,000 |\n| 2017 | 飓风Maria后设立飓风救济基金(CBI特殊通道) |\n| 2023.2 | 美国与加勒比CBI国家举行圆桌会议，施压涨价+强化审查 |\n| 2024.3 | 加勒比五国签署联合备忘录，承诺集体涨价至$200K+ |\n| 2024.7 | 强制面试+安全审查升级正式实施 |\n| 2024.12 | 与美国签证互惠安排受限 |\n| 2026 | 当前单人门槛$200,000（加勒比五国统一最低价） |\n";`;
