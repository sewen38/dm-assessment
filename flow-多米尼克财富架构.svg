<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="100%" style="max-width:720px;font-family:system-ui,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#004d2e"/></marker>
  </defs>
  <rect width="720" height="460" fill="#f8fafc" rx="14"/>
  <text x="360" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#004d2e">多米尼克CBI财富架构</text>
  <!-- Top -->
  <rect x="210" y="42" width="300" height="48" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="360" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">中国境内事业主体/家庭资产</text>
  <text x="360" y="78" text-anchor="middle" font-size="9" fill="#78716c">境内运营公司+房产+金融资产</text>
  <!-- Arrow -->
  <line x1="360" y1="90" x2="360" y2="120" stroke="#004d2e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- CBI passport -->
  <rect x="180" y="120" width="360" height="52" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="360" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">🇩🇲 多米尼克CBI护照（境外身份工具）</text>
  <text x="360" y="160" text-anchor="middle" font-size="9" fill="#10b981">EDF捐款$20万/政府批准房产$20万 → 4-6月获批 → 无居住要求</text>
  <!-- Arrows branching -->
  <line x1="200" y1="172" x2="150" y2="205" stroke="#004d2e" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="360" y1="172" x2="360" y2="205" stroke="#004d2e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="172" x2="570" y2="205" stroke="#004d2e" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Three boxes -->
  <rect x="50" y="205" width="200" height="48" rx="10" fill="#fff" stroke="#004d2e" stroke-width="1.5"/>
  <text x="150" y="223" text-anchor="middle" font-size="10" font-weight="600" fill="#004d2e">国际出行便利</text>
  <text x="150" y="241" text-anchor="middle" font-size="9" fill="#6b7280">140+免签 · 申根/英国/香港</text>
  <rect x="260" y="205" width="200" height="48" rx="10" fill="#fff" stroke="#004d2e" stroke-width="1.5"/>
  <text x="360" y="223" text-anchor="middle" font-size="10" font-weight="600" fill="#004d2e">境外银行/金融账户</text>
  <text x="360" y="241" text-anchor="middle" font-size="9" fill="#6b7280">香港/新加坡/迪拜开户</text>
  <rect x="470" y="205" width="200" height="48" rx="10" fill="#fff" stroke="#004d2e" stroke-width="1.5"/>
  <text x="570" y="223" text-anchor="middle" font-size="10" font-weight="600" fill="#004d2e">0%个税 · 资产保护</text>
  <text x="570" y="241" text-anchor="middle" font-size="9" fill="#6b7280">无个税/资本利得税/遗产税</text>
  <!-- Arrows converge -->
  <line x1="150" y1="253" x2="150" y2="290"/>
  <line x1="360" y1="253" x2="360" y2="290"/>
  <line x1="570" y1="253" x2="570" y2="290"/>
  <line x1="150" y1="290" x2="570" y2="290" stroke="#004d2e" stroke-width="1.5"/>
  <line x1="360" y1="290" x2="360" y2="320" stroke="#004d2e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Global assets -->
  <rect x="160" y="320" width="400" height="50" rx="12" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <text x="360" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">全球资产组合</text>
  <text x="360" y="358" text-anchor="middle" font-size="9" fill="#94a3b8">股票+债券+基金+保险 | 香港/新加坡/瑞士/迪拜金融中心</text>
  <!-- Optional trust -->
  <line x1="360" y1="370" x2="360" y2="398" stroke="#004d2e" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="230" y="398" width="260" height="42" rx="10" fill="#e8faf0" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="360" y="416" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">可选：海外信托（传承规划）</text>
  <text x="360" y="432" text-anchor="middle" font-size="9" fill="#10b981">不可撤销信托 · 家族信托 · 资产保护</text>
</svg>